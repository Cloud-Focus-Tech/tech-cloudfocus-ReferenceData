spring.application.name=ReferenceData

# Optional local configuration, resolved from the process working directory.
spring.config.import=optional:file:./.env[.properties]

# Reserved for a future connection client; environment variables override .env values.
app.connection.url=${CONNECTION_URL:}
app.connection.username=${CONNECTION_USERNAME:}
app.connection.password=${CONNECTION_PASSWORD:}

# Azure container root contains index.json. Refresh delay is in milliseconds.
app.storage.connection-string=${STORAGE_CONNECTION_STRING:}
app.storage.container-name=${STORAGE_CONTAINER_NAME:reference-data}
app.storage.refresh-interval-ms=${STORAGE_REFRESH_INTERVAL_MS:300000}

# Keep documentation and assets under /api so the /rds gateway rewrite covers them.
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.packages-to-scan=tech.cloudfocus.ReferenceData.controller
# Relative URLs work both locally (/api) and through the gateway (/rds).
springdoc.swagger-ui.config-url=../v3/api-docs/swagger-config
springdoc.swagger-ui.url=../v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
