name: Native package and lab deployment

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the lab after publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Test and compile Linux amd64 native image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: reference-data-native:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise the actual native executable without cloud credentials
        shell: pwsh
        run: ./scripts/Smoke-Native.ps1 -Image reference-data-native:ci
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish private package after native smoke test
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cloud-focus-tech/tech-cloudfocus-referencedata:sha-${{ github.sha }}
            ghcr.io/cloud-focus-tech/tech-cloudfocus-referencedata:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Cloud-Focus-Tech/tech-cloudfocus-ReferenceData
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

